name: Auto-generate video

on:
  schedule:
    - cron: "0 */10 * * *"
  workflow_dispatch: {}

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
           GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}  
        run: python main.py

      - name: Upload finished video as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: output/
          retention-days: 14
